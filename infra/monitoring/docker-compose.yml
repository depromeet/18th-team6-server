services:
  prometheus:       # 메트릭 수집/저장
    image: prom/prometheus:latest
    restart: on-failure:3
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus    # 메트릭 시계열 영속화 (재시작 시 히스토리 보존)
    networks:
      - orbit       # 루트 compose의 orbit-network에 참여 -> app 서비스를 'app:8080'으로 직접 스크랩

  alertmanager:     # 알람 전송, 현재 디스코드로 전송
    image: prom/alertmanager:latest
    restart: on-failure:3
    ports: ["9093:9093"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=${ALERT_TITLE_LINK}"    # AlertManager 실행 시 운영 도메인 전달
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro # 우리가 작성한 alertmanager.yml을 읽어와 기본 규칙을 설정해 해당 규칙대로 알람 발송
      - alertmanager-data:/alertmanager    # 알람 그룹 상태 영속화 (재시작 시 중복 알림 방지)
    secrets:
      # alertmanager 컨테이너는 nobody(65534)로 실행되는데, 호스트 secret 파일은 0600 ubuntu 소유라 기본 마운트(0400 root)로는 읽지 못함.
      # mode 0444로 마운트해 nobody가 읽을 수 있게 한다. secret은 컨테이너 tmpfs에만 노출되므로 호스트 보안과 무관.
      - source: discord_webhook_url
        target: discord_webhook_url
        mode: 0444
    networks:
      - orbit

  grafana:    # 시각화
    image: grafana/grafana:latest
    restart: on-failure:3
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana    # 대시보드 편집/사용자 설정 영속화
    networks:
      - orbit

secrets:
  discord_webhook_url:
    file: ./secrets/discord_webhook_url

networks:
  orbit:
    external: true        # 루트 docker-compose.yml이 만든 네트워크에 외부 참여 (이 compose가 직접 만들지 않음)
    name: orbit-network

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
