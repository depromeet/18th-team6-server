services:
  app:
    image: ${APP_IMAGE:-orbit-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit-server
    restart: on-failure:3
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    networks:
      - orbit

networks:
  orbit:
    name: orbit-network
