name: CI/CD

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"

  workflow_dispatch:

jobs:
  build-docker-image:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Check Pi deployment secrets
        env:
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          test -n "$SERVER_PORT"
          test -n "$FIREBASE_CREDENTIALS_JSON"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Create deploy directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p ~/deploy

      - name: Copy Compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,docker-compose.pi.yml"
          target: "~/deploy/"

      - name: Copy monitoring stack
        # infra/monitoring 디렉토리 통째로 ~/deploy/infra/monitoring 으로 복사
        # (secrets/*, .env는 gitignore 되어 runner에 없음 -> 안전)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "infra/monitoring/"
          target: "~/deploy/"

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Docker build & push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          docker build -t ${DOCKER_USERNAME}/${DOCKER_REPO}:latest .
          docker push ${DOCKER_USERNAME}/${DOCKER_REPO}:latest

  deploy:
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -eu
            umask 077

            # 앱 .env
            cat <<'ENVEOF' > ~/deploy/.env
            ${{ secrets.ENV_FILE }}
            ENVEOF
            test -s ~/deploy/.env

            cat <<'FIREBASEEOF' > ~/deploy/firebase-credentials.json.tmp
            ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            FIREBASEEOF
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data.get("type") == "service_account" and data.get("private_key") and data.get("client_email")' ~/deploy/firebase-credentials.json.tmp
            mv ~/deploy/firebase-credentials.json.tmp ~/deploy/firebase-credentials.json
            printf '\nAPP_IMAGE=%s/%s:latest\nFIREBASE_CREDENTIALS_HOST_PATH=%s/deploy/firebase-credentials.json\n' '${{ secrets.DOCKER_USERNAME }}' '${{ secrets.DOCKER_REPO }}' "$HOME" >> ~/deploy/.env

            # 모니터링 .env (Grafana admin 비밀번호 등)
            cat <<'MENVEOF' > ~/deploy/infra/monitoring/.env
            ${{ secrets.MONITORING_ENV_FILE }}
            MENVEOF

            # Discord webhook secret 파일 (alertmanager가 slack_api_url_file로 읽음)
            mkdir -p ~/deploy/infra/monitoring/secrets
            cat <<'WHEOF' > ~/deploy/infra/monitoring/secrets/discord_webhook_url
            ${{ secrets.MONITORING_DISCORD_WEBHOOK_URL }}
            WHEOF
            # alertmanager 컨테이너는 nobody(65534)로 실행되어 호스트 ubuntu 소유 파일을 0600으로 두면 읽지 못함.
            # docker-compose의 secret mode 옵션은 non-Swarm에서 무시되므로 호스트 파일 권한에서 직접 풀어준다.
            chmod 644 ~/deploy/infra/monitoring/secrets/discord_webhook_url

            # Pi의 MySQL을 유지하면서 앱 이미지만 갱신한다.
            cd ~/deploy
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml config --quiet
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml pull app
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml up -d mysql
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml up -d --no-build app

            attempt=0
            until curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 90 ]; then
                docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml ps -a
                docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml logs --tail=100 app mysql
                exit 1
              fi
              sleep 2
            done
            if docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml logs --no-color app | grep -q 'Firebase 초기화 실패'; then
              echo 'Firebase initialization failed'
              exit 1
            fi

            # 모니터링 스택 기동 (orbit-network에 외부 참여)
            # 이미 떠 있으면 변경된 config만 반영, 처음이면 새로 생성
            docker compose --env-file infra/monitoring/.env -f infra/monitoring/docker-compose.yml up -d
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.pi.yml ps
