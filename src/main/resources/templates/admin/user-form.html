<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Obrit Admin - ${pageTitle}|">Obrit Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="admin-header">
    <a class="admin-brand" href="/admin/users">Obrit administration</a>
    <nav class="admin-nav">
        <a href="/admin/users" class="active">Users</a>
        <a href="/admin/icons">Icons</a>
        <a href="/admin/categories">Categories</a>
        <a href="/admin/items">Items</a>
    </nav>
</header>
<div class="breadcrumbs"><a href="/admin/users">Home</a> &rsaquo; <a href="/admin/users">Users</a> &rsaquo; <span th:text="${pageTitle}"></span></div>
<main class="content">
    <div th:if="${message}" class="notice" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div class="content-header">
        <h1 th:text="${pageTitle}"></h1>
    </div>

    <section class="module">
        <h2>User</h2>
        <form method="post" th:action="${formAction}">
            <div class="form-row">
                <label for="uuid">UUID</label>
                <input id="uuid" name="uuid" required th:value="${isChange ? user.uuid : ''}" th:readonly="${isChange}">
            </div>
            <div class="form-row">
                <label for="name">Name</label>
                <input id="name" name="name" required th:value="${isChange ? user.name : ''}">
            </div>
            <div class="form-row" th:if="${isChange}">
                <label>Created</label>
                <div class="readonly" th:text="${user.createdAt}"></div>
            </div>
            <div class="form-row" th:if="${isChange}">
                <label>Updated</label>
                <div class="readonly" th:text="${user.updatedAt}"></div>
            </div>
            <div class="submit-row">
                <a class="button" href="/admin/users">Back</a>
                <button class="default" type="submit">Save</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
