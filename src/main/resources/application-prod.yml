server:
  forward-headers-strategy: native

spring:
  application:
    name: obrit-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PWD}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

obrit:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
