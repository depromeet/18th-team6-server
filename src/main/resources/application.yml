spring:
  profiles:
    active: dev
  flyway:
    enabled: false

receipt:
  batch:
    max-size: 6   # 한 번의 Gemini 호출에 묶을 최대 영수증 수

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # Duration p95/p99 계산을 위한 히스토그램 버킷 활성화
    tags:
      application: obrit