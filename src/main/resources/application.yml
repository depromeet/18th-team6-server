spring:
  profiles:
    active: dev
  flyway:
    enabled: false

notification:
  schedule:
    # 자동 발송 on/off는 notification_settings 테이블에서 관리한다(어드민에서 변경).
    cron: "0 0 9 * * *"
    zone: "Asia/Seoul"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # Duration p95/p99 계산을 위한 히스토그램 버킷 활성화
    tags:
      application: obrit