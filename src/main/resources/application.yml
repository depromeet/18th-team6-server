spring:
  profiles:
    active: dev
  flyway:
    enabled: false

notification:
  schedule:
    # 기기 등록(FID) 커버리지 확인 및 공지 발송 이후 운영에서 직접 켠다.
    enabled: false
    cron: "0 0 9 * * *"
    zone: "Asia/Seoul"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # Duration p95/p99 계산을 위한 히스토그램 버킷 활성화
    tags:
      application: obrit