plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.21'
	id 'org.jetbrains.kotlin.kapt' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

group = 'depromeet.hotsix'
version = '0.0.1-SNAPSHOT'
description = 'obrit'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	kapt 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	kapt 'jakarta.annotation:jakarta.annotation-api'
	kapt 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'com.h2database:h2'
	implementation platform('software.amazon.awssdk:bom:2.31.63')
	implementation 'software.amazon.awssdk:s3'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// ArchUnit - 아키텍처 규칙 검증
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

ktlint {
	ignoreFailures = false
	outputToConsole = true

	reporters {
		reporter 'plain'
		reporter 'checkstyle'
	}
}

tasks.named('check') {
	dependsOn 'ktlintCheck'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Harness 통합 검증 태스크
tasks.register('harness') {
	dependsOn 'check'
	group = 'verification'
	description = 'Runs all harness validations (ktlint + ArchUnit + tests)'
}

// Git Hooks 설치는 명시적인 로컬 개발 환경 설정으로만 수행한다.
tasks.register('installGitHooks') {
	group = 'setup'
	description = 'Installs local git hooks for this repository.'
	inputs.dir("$rootDir/.githooks")

	onlyIf {
		file("$rootDir/.githooks").exists() && file("$rootDir/.git").exists()
	}

	doLast {
		def hooksDir = providers.exec {
			commandLine 'git', 'rev-parse', '--git-path', 'hooks'
		}.standardOutput.asText.get().trim()

		if (!hooksDir) {
			throw new GradleException('Could not resolve git hooks directory.')
		}

		copy {
			from "$rootDir/.githooks"
			into hooksDir
			filePermissions {
				unix('rwxr-xr-x')
			}
		}
	}
}
